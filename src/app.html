<!doctype html>
<html lang="id" data-theme="light" data-theme-mode="system">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<script>
			(() => {
				const storageKey = 'tts-generator:theme';
				const supportedThemes = ['light', 'dark', 'system'];

				let themeMode = 'system';

				try {
					const storedTheme = window.localStorage.getItem(storageKey);

					if (storedTheme && supportedThemes.includes(storedTheme)) {
						themeMode = storedTheme;
					}
				} catch {
					// Fallback ke system theme jika browser storage tidak tersedia.
				}

				const resolvedTheme =
					themeMode === 'system'
						? window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light'
						: themeMode;

				document.documentElement.dataset.theme = resolvedTheme;
				document.documentElement.dataset.themeMode = themeMode;
				document.documentElement.style.colorScheme = resolvedTheme;
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
